<!-- ============================================================
 LOOKOPTICS AR 가상착용 연결 스크립트 (Cafe24 상품상세 스킨용)
 삽입 위치: 디자인관리 > 스킨 편집 > product/detail.html 의 </body> 바로 위 (반응형이 아니면 모바일 스킨 m/product/detail.html 에도 동일 삽입)
 동작: 상품 식별자(모델명 → 자체상품코드 → 상품번호)로 AR 서버의 catalog.json 을 조회해
       AR 자산이 있으면 기존 "TRY ON IT" 버튼에 링크를 걸고, 없으면 버튼을 숨깁니다. 상품별 수정 불필요.
 외부 JS 로드 없음 · 고객 정보 전송 없음 · 실패 시 조용히 버튼만 숨김
 ============================================================ -->
<script>
(function(){
  var AR_BASE = 'https://slowfun2u-dot.github.io/vto/';
  // Cafe24 치환자 (스킨 HTML 안에서만 동작). 모델명 예: "SF1096SLBK 001 58"
  var modelName  = '{$model_name}';
  var customCode = '{$custom_product_code}';
  var productNo  = '{$product_no}';
  var prodName   = '{$product_name}';
  var price      = '{$product_price}';
  // ===== "AI로 가상착용해보기" 원형 배지: ① 상단 메인 이미지 우측 하단 ② 상세 정면 이미지 바로 아래 =====
  function arBadges(url){
    if (document.getElementById('lkVtoCss')) return;
    var st = document.createElement('style'); st.id = 'lkVtoCss';
    st.textContent =
      '.lk-vto{position:relative;display:flex;align-items:center;justify-content:center;width:88px;height:88px;border-radius:50%;text-decoration:none;'+
      'background:radial-gradient(120% 120% at 30% 20%,#2b2b2b 0%,#0d0d0d 60%,#000 100%);color:#fff;'+
      'box-shadow:0 8px 22px rgba(0,0,0,.28),inset 0 0 0 1.5px rgba(214,178,107,.95),inset 0 0 0 5px rgba(0,0,0,.55),inset 0 0 0 6px rgba(214,178,107,.35);'+
      'font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent;transition:transform .2s ease}'+
      '.lk-vto:active{transform:scale(.94)}'+
      '.lk-vto .lk-in{display:flex;flex-direction:column;align-items:center;line-height:1.12;text-align:center}'+
      '.lk-vto svg{width:24px;height:12px;margin-bottom:3px}'+
      '.lk-vto b{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#d6b26b}'+
      '.lk-vto span.t{font-size:12px;font-weight:700;letter-spacing:-.02em}'+
      '.lk-vto:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(214,178,107,.55);animation:lkPulse 2.4s ease-out infinite}'+
      '@keyframes lkPulse{0%{transform:scale(.92);opacity:.9}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}'+
      '@media (prefers-reduced-motion:reduce){.lk-vto:before{animation:none;opacity:.5}}'+
      '.lk-vto-float{position:absolute;right:14px;bottom:30px;z-index:20}'+
      '.lk-vto-block{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0 26px}'+
      '.lk-vto-block .lk-vto{width:100px;height:100px}.lk-vto-block .lk-vto svg{width:28px;height:14px}.lk-vto-block .lk-vto span.t{font-size:13.5px}.lk-vto-block .lk-vto b{font-size:11.5px}'+
      '.lk-vto-cap{font-size:12px;color:#777;letter-spacing:-.01em}';
    document.head.appendChild(st);
    var icon = '<svg viewBox="0 0 48 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><circle cx="36" cy="13" r="8"/><path d="M20 12c2.5-2 5.5-2 8 0M4 11L1 6M44 11l3-5"/></svg>';
    function badge(){ var a = document.createElement('a'); a.href = url; a.target = '_self'; a.className = 'lk-vto'; a.setAttribute('aria-label', 'AI로 가상착용해보기');
      a.innerHTML = '<span class="lk-in">' + icon + '<b>AI로</b><span class="t">가상착용<br>해보기</span></span>'; return a; }
    // ① 메인 이미지 영역(Cafe24 스킨 후보 → 시뮬 .slider)
    var mainSel = ['.xans-product-image .keyImg', '.keyImg', '.xans-product-image .thumbnail', '.xans-product-image .prdImg', '.detailArea .imgArea', '.slider'];
    var host = null; for (var i = 0; i < mainSel.length && !host; i++) host = document.querySelector(mainSel[i]);
    if (host) { if (getComputedStyle(host).position === 'static') host.style.position = 'relative'; var f = badge(); f.classList.add('lk-vto-float'); host.appendChild(f); }
    // ② 상세 정면 이미지 하단: 상세 본문 안 첫 상품 정면 이미지(파일명 Detail/front 우선, 없으면 첫 큰 이미지)
    var detSel = ['#prdDetail', '.xans-product-detail .cont', '.prdDetail', 'section.detail'], det = null;
    for (var j = 0; j < detSel.length && !det; j++) det = document.querySelector(detSel[j]);
    if (det) {
      var imgs = [].slice.call(det.querySelectorAll('img')), pick = null;
      for (var k = 0; k < imgs.length && !pick; k++) { var s = imgs[k].getAttribute('ec-data-src') || imgs[k].getAttribute('src') || ''; if (/front|_Detail\/|SA_Detail|2_Detail/i.test(s)) pick = imgs[k]; }
      if (!pick) pick = imgs[0] || null;
      var blk = document.createElement('div'); blk.className = 'lk-vto-block'; blk.appendChild(badge());
      var cap = document.createElement('div'); cap.className = 'lk-vto-cap'; cap.textContent = '카메라로 내 얼굴에 바로 써보세요'; blk.appendChild(cap);
      if (pick) pick.insertAdjacentElement('afterend', blk); else det.insertBefore(blk, det.firstChild);
    }
  }
  function norm(s){ return (s||'').replace(/\{\$[^}]*\}/g,'').trim().replace(/\s+/g,'-').toUpperCase(); }
  var meta = function(p){ var m=document.querySelector('meta[property="'+p+'"]'); return m?m.getAttribute('content'):''; };
  var candidates = [norm(modelName), norm(customCode), norm(productNo), norm(meta('meta-product:productId'))].filter(Boolean);
  // 실제 스킨: <a href="#" class="ar_link fm-fitting-btn" style="display:none"><img alt="TRY ON IT"></a>  (이미지 슬라이더 우상단, 기본 숨김)
  var img = document.querySelector('img[alt="TRY ON IT"]');
  var btn = document.querySelector('a.ar_link') || (img ? (img.closest('a') || img.parentElement) : null);
  if (!candidates.length) return;
  // 모델명 치환자가 비어 있으면 제목의 괄호 안 코드로 보완: "...(SF1096SLBK 001 58)"
  if (!norm(modelName)) { var mm = (document.title || '').match(/\(([A-Z0-9][A-Z0-9 \-]+)\)/); if (mm) candidates.unshift(norm(mm[1])); }
  if (btn) btn.style.display = 'none';                   // 확인 전에는 숨김 (스킨 기본값과 동일)
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  if (ctrl) setTimeout(function(){ ctrl.abort(); }, 4000);
  fetch(AR_BASE + 'assets/catalog.json?_=' + Date.now(), {cache:'no-store', signal: ctrl && ctrl.signal})
    .then(function(r){ return r.ok ? r.json() : {}; })
    .then(function(cat){
      var key = null;
      for (var i=0;i<candidates.length;i++){ if (cat && cat[candidates[i]]) { key = candidates[i]; break; } }
      if (!key) { if (btn) btn.style.display = 'none'; return; }
      var og = meta('og:image');
      var url = AR_BASE + '?sku=' + encodeURIComponent(key)
              + '&auto=1'
              + '&back=' + encodeURIComponent(location.href)
              + '&name=' + encodeURIComponent(norm(prodName) ? prodName : document.title)
              + '&price=' + encodeURIComponent(price && price.indexOf('{$')<0 ? price : '')
              + (og ? '&img=' + encodeURIComponent(og) : '');
      if (btn) { btn.setAttribute('href', url); btn.setAttribute('target', '_self'); btn.setAttribute('aria-label', '가상착용 해보기'); btn.style.display = 'block'; btn.style.visibility = ''; }
      arBadges(url);
    })
    .catch(function(){ if (btn) btn.style.display = 'none'; });
})();
</script>
